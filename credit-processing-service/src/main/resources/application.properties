spring.application.name=credit-processing-service

spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=credit-processing-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=ru.netology.event

spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=credit_user
spring.rabbitmq.password=credit_pass